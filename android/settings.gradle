pluginManagement {
  def localProps = new Properties()
  def localPropsFile = new File(rootDir, 'local.properties')
  if (localPropsFile.exists()) {
    localProps.load(localPropsFile.newInputStream())
  }
  def nodeBin = System.getenv('NODE_BINARY') ?:
    localProps.getProperty('NODE_BINARY') ?:
    System.getProperty('node.binary') ?:
    ['/opt/homebrew/bin/node', '/usr/local/bin/node', '/usr/bin/node'].find { new File(it).exists() } ?: 'node'

  def version = [nodeBin, "-e", "console.log(require('react-native/package.json').version);"].execute(null, rootDir).text.trim()
  def (_, reactNativeMinor, reactNativePatch) = version.split("-")[0].tokenize('.').collect { it.toInteger() }

  includeBuild(new File([nodeBin, "--print", "require.resolve('@react-native/gradle-plugin/package.json')"].execute(null, rootDir).text.trim()).getParentFile().toString())
  if(reactNativeMinor == 74 && reactNativePatch <= 3){
    includeBuild("react-settings-plugin")
  }
}

plugins { id("com.facebook.react.settings") }

def localProps = new Properties()
def localPropsFile = new File(rootDir, 'local.properties')
if (localPropsFile.exists()) {
  localProps.load(localPropsFile.newInputStream())
}
def nb = System.getenv('NODE_BINARY') ?:
  localProps.getProperty('NODE_BINARY') ?:
  System.getProperty('node.binary') ?:
  ['/opt/homebrew/bin/node', '/usr/local/bin/node', '/usr/bin/node'].find { new File(it).exists() } ?: 'node'

def getRNMinorVersion() {
  def lp = new Properties()
  def lpFile = new File(rootDir, 'local.properties')
  if (lpFile.exists()) {
    lp.load(lpFile.newInputStream())
  }
  def nodeBin = System.getenv('NODE_BINARY') ?:
    lp.getProperty('NODE_BINARY') ?:
    System.getProperty('node.binary') ?:
    ['/opt/homebrew/bin/node', '/usr/local/bin/node', '/usr/bin/node'].find { new File(it).exists() } ?: 'node'

  def version = [nodeBin, "-e", "console.log(require('react-native/package.json').version);"].execute(null, rootDir).text.trim()

  def coreVersion = version.split("-")[0]
  def (major, minor, patch) = coreVersion.tokenize('.').collect { it.toInteger() }

  return minor
}

if (getRNMinorVersion() >= 75) {
  extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    if (System.getenv('EXPO_UNSTABLE_CORE_AUTOLINKING') == '1') {
      println('[32mUsing expo-modules-autolinking as core autolinking source[0m')
      def command = [
        nb,
        '--no-warnings',
        '--eval',
        'require(require.resolve(\'expo-modules-autolinking\', { paths: [require.resolve(\'expo/package.json\')] }))(process.argv.slice(1))',
        'react-native-config',
        '--json',
        '--platform',
        'android'
      ].toList()
      ex.autolinkLibrariesFromCommand(command)
    } else {
      def npxBin = new File(nb).getParent() + "/npx"
      ex.autolinkLibrariesFromCommand([npxBin, "@react-native-community/cli", "config"])
    }
  }
}

